# This workflow will install Python dependencies, run tests and lint with a variety of Python versions on windows
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: windows-test

on:
  push:
    branches: ["main"]
    tags:
      - "release_*"
  pull_request:
    branches: ["main"]

env:
  UV_LOG: debug
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --all-groups --verbose

      - name: Lint with Ruff
        run: uv run ruff check --output-format=github src
        continue-on-error: true

      - name: Test with pytest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run pytest -v

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py${{ matrix.python-version }}-logs
          path: |
            uv.lock
            ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore
          retention-days: 7
        # Note: On Python 3.14+, test_shared_client_connection_pooling is expected to fail (xfail)
        # due to httpcore 1.1.x incompatibility with Python 3.14's typing.Union
        # This is an upstream issue that will be resolved in httpcore 1.2.0+
